<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Random Line Picker</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    #output { margin-top: 20px; font-size: 1.1em; white-space: pre-wrap; }
    button { padding: 8px 14px; font-size: 1em; margin-top: 10px; }
  </style>
</head>
<body>

<h2>Random Line Picker</h2>
<p>
  Click "Pick Random Line" to see 3 options.  
  Then click one of the options to add it to the list.
</p>

<button id="pickBtn" disabled>Pick Random Line</button>

<!-- Where the 3 choices will appear -->
<div id="choices" style="margin-top:20px;"></div>

<!-- Where chosen lines accumulate -->
<div id="output"></div>

<script>
  let rows = [];

  // TODO: Replace this URL with your actual raw GitHub CSV URL
  const csvUrl = "https://raw.githubusercontent.com/drewkas/Chateaugay-Selects/refs/heads/master/data.csv";

  // Load CSV from GitHub
  fetch(csvUrl)
    .then(response => response.text())
    .then(text => {
      rows = text.trim().split("\n").map(line => line.split(","));
      document.getElementById("pickBtn").disabled = false;
      document.getElementById("output").textContent =
        `Loaded ${rows.length} rows from GitHub.`;
    })
    .catch(err => {
      document.getElementById("output").textContent =
        "Error loading CSV from GitHub.";
      console.error(err);
    });

  const pickBtn = document.getElementById("pickBtn");
  const choicesDiv = document.getElementById("choices");
  const output = document.getElementById("output");

  // Main button: show 3 random choices
  pickBtn.addEventListener("click", () => {
    if (rows.length === 0) {
      output.textContent = "No data loaded.";
      return;
    }

    // Clear previous choices
    choicesDiv.innerHTML = "<strong>Choose one of the three options:</strong><br><br>";

    // Pick 3 distinct random rows
    const indices = new Set();
    while (indices.size < 3 && indices.size < rows.length) {
      indices.add(Math.floor(Math.random() * rows.length));
    }

    const choiceIndices = Array.from(indices);

    choiceIndices.forEach((idx, i) => {
      const row = rows[idx];

      const btn = document.createElement("button");
      btn.textContent = `Option ${i + 1}: ${row.join(" | ")}`;
      btn.style.display = "block";
      btn.style.margin = "6px 0";

      // When user chooses one → append it to the output list
      btn.addEventListener("click", () => {
        const line = document.createElement("div");
        line.innerHTML = `<strong>Row ${idx + 1}:</strong> ${row.join(" | ")}`;
        output.appendChild(line);

        // Clear choices after selection
        choicesDiv.innerHTML = "";
      });

      choicesDiv.appendChild(btn);
    });
  });
</script>

</body>
</html>
